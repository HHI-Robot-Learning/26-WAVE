# Franka Panda arm with its parallel-jaw hand, 3.8 cm cubes, 5 Hz control. Contacts use a 0.02 s
# time constant: at 0.006 s (3 sim steps) the closing jaws eject about a third of the cubes.
tau_step: 0.2
tau_sim: 0.002
action_scale: 0.25
friction: "2.0 0.5 0.2"
solref: "0.02 1"
solimp: "0.9 0.95 0.001 0.5 2"
impratio: 10.0
box_box_primitive: true
contacts_per_object: 32
grip_binary: true
grip_hysteresis: 0.3
grip_closed_at_upper: false
ctrl_antiwindup: true
grasp_ee_point: panda_hand_tip
arm_proxies: [armproxy_forearm, armproxy_wrist]
